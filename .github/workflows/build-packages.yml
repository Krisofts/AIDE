name: Build AIDE Package Repo

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "packaging/**"

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO(Phase 0 §6.3 di docs/PACKAGE_REPO.md): build-openjdk17.sh baru
      # kerangka kerja (langkah-langkahnya masih TODO, belum bisa dieksekusi
      # sungguhan) - butuh Android NDK + source OpenJDK + runner khusus.
      # Job ini baru membangun & mempublikasikan .deb dari staging directory
      # yang SUDAH berisi hasil build - bukan menjalankan cross-compile itu
      # sendiri.
      #
      # - name: Cross-compile OpenJDK 17 (aarch64-linux-android)
      #   run: ./packaging/scripts/build-openjdk17.sh $ANDROID_NDK_HOME build/staging/openjdk-17

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      # Placeholder: begitu ada staging dir hasil build (mis. dari step di
      # atas), panggil build-deb.sh untuk tiap paket:
      # - name: Build .deb - openjdk-17
      #   run: |
      #     ./packaging/scripts/build-deb.sh \
      #       build/staging/openjdk-17 \
      #       packaging/control/openjdk-17.control \
      #       packaging/repo/pool/main/o/openjdk-17/openjdk-17_17.0.9_aarch64.deb

      - name: Generate repo index
        run: ./packaging/scripts/generate-index.sh packaging/repo

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packaging/repo
          destination_dir: packaging/repo
